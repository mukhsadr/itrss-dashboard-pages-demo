<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1423"><title>ITRSS Metrics</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--card:#121e30;--line:#293d55;--text:#eaf2fe;--muted:#9fb4cf}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}button:focus-visible,.slice:focus-visible{outline:2px solid #c6e5ff;outline-offset:2px}
main{max-width:1050px;margin:auto;height:100dvh;min-height:440px;padding:clamp(9px,1.5vw,18px);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:clamp(8px,1.2vh,14px)}
.modes{display:flex;justify-content:center;gap:8px}
.mode{min-height:40px;padding:8px 19px;border-radius:10px;border:1px solid #354b68;background:#17283f;color:#bcd3ea;font-size:13px;font-weight:650;transition:background .15s,border-color .15s}
.mode[aria-pressed=true]{background:#254c75;border-color:#6eaff0;color:white}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.metric{min-width:0;min-height:65px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:10px 4px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .16s,border-color .16s,transform .16s}
.metric[aria-pressed=true]{border-color:#79bbf4;background:#203c59}.metric:hover{background:#1d324d}
.metric span{font-size:clamp(10px,1.1vw,13px);font-weight:650;text-align:center}
.metric strong{font-size:clamp(20px,2.7vw,32px);line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.canvas{min-height:0;background:#112036;border:1px solid #263b56;border-radius:15px;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden}
.donut{height:min(100%,710px);width:min(100%,710px);aspect-ratio:1;position:relative}
svg{height:100%;width:100%;display:block}.slice{stroke:#112036;stroke-width:1;cursor:pointer;transition:opacity .1s}.slice:hover{filter:brightness(1.18)}
.center{position:absolute;inset:36%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;gap:3px;text-align:center;overflow:hidden}
.center strong{font-size:clamp(19px,2.05vw,32px);line-height:1.05;letter-spacing:-.045em;white-space:nowrap;font-variant-numeric:tabular-nums;max-width:100%}
.center span{max-width:100%;color:#bdd0e8;font-size:clamp(9px,.75vw,11px);line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#status{position:absolute;bottom:7px;font-size:11px;color:#f7bea7}
@media(max-width:580px){main{padding:7px;gap:7px;min-height:340px}.mode{padding:6px 13px;font-size:12px}.metric{border-radius:8px}.canvas{border-radius:9px}.center strong{font-size:clamp(18px,5.2vw,27px)}}

/* Keep the number entirely inside the donut hole at every screen size. */
.canvas{background:#121e30;border-color:#263b55;box-shadow:none}
.metric{background:#121e30;border-color:#293c53}
.metric:hover{border-color:#7ca9d5}
.slice{transition:opacity .16s,filter .16s,stroke-width .16s;stroke:#121e30;stroke-width:1.5;filter:none}
.donut{height:min(100%,760px);width:min(100%,760px)}
@media(max-width:580px){.center{inset:35%}.center span{font-size:9px}}

/* Material-inspired restrained colors, selection surfaces and phone touch targets. */
.center{background:#121e30;border-radius:50%;inset:34.8%}
.center strong{font-size:clamp(21px,2.25vw,36px)}
.center span{color:#b8c4df}
.modes{gap:10px}
.slice:hover{filter:brightness(1.15)}
@media(prefers-reduced-motion:reduce){.slice,.metric,.mode{transition:none}}
@media(max-width:580px){.mode{min-height:44px}.metric{min-height:58px;border-radius:14px}.center{inset:35%}}

/* Chart-first: original local ring contrast and lighter visual chrome. */
main{max-width:1120px;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
.canvas{border-radius:12px}
.metric{border-radius:11px;min-height:58px;padding:7px 4px}
.mode{min-height:38px}
.center span{color:#a5bdd7}
#status{left:50%;transform:translateX(-50%);bottom:12px;white-space:nowrap;font-size:11px;color:#a5bdd7;pointer-events:none}
@media(max-width:600px){#status{bottom:5px;white-space:normal;text-align:center;width:95%;font-size:9px}}
</style></head><body>
<main>
<nav class="modes" aria-label="Data mode"><button type="button" class="mode" data-mode="users" aria-pressed="true">Mill Users</button><button type="button" class="mode" data-mode="papers" aria-pressed="false">Publications</button></nav>
<section class="metrics" id="metrics" aria-label="Metrics">
<button class="metric" type="button" data-kpi="0"><span id="label0">Users</span><strong id="val0">—</strong></button>
<button class="metric" type="button" data-kpi="1"><span id="label1">Active</span><strong id="val1">—</strong></button>
<button class="metric" type="button" data-kpi="2"><span id="label2">Departments</span><strong id="val2">—</strong></button>
<button class="metric" type="button" data-kpi="3"><span id="label3">Advisors</span><strong id="val3">—</strong></button>
</section>
<section class="canvas" aria-label="Interactive concentric rings"><div class="donut">
<svg id="chart" viewBox="0 0 680 680" role="img" aria-label="Four-ring user distribution or three-ring publication distribution"></svg>
<div class="center"><strong id="number">—</strong><span id="centerLabel">Users</span></div>
</div><div id="status" role="status"></div></section>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),SVG='http://www.w3.org/2000/svg';
const palettes=[
['#5c9eff','#3c7fdb','#8ebdff','#4568ae','#a1ceef','#6669ba','#378dc0','#86a3d0'],
['#2cbdaf','#159f94','#75d8bd','#3a8f85','#a1e0c9','#5eb3a2','#248478'],
['#e6a85e','#d58e46','#f3c681','#b87555','#ffd59e','#caac71','#f0a27d','#ad805b'],
['#ad91e4','#906dd1','#c4a9fa','#7157a9','#b39fe2','#9979bf','#d0b7ef','#71539a']];
const fmt=x=>Number(x||0).toLocaleString('en-US');
const el=(name,attrs={})=>{const e=document.createElementNS(SVG,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e};
const pt=(r,a)=>[340+r*Math.cos(a),340+r*Math.sin(a)];
function pathFor(ri,ro,a,b){b=Math.min(b,a+2*Math.PI-.00001);const [x1,y1]=pt(ro,a),[x2,y2]=pt(ro,b),[x3,y3]=pt(ri,b),[x4,y4]=pt(ri,a),big=b-a>Math.PI?1:0;return 'M'+x1+' '+y1+' A'+ro+' '+ro+' 0 '+big+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+ri+' '+ri+' 0 '+big+' 0 '+x4+' '+y4+' Z'}
let source=null,mode='users',selected=null,kpi=null,linked=null;
function current(){return mode==='users'?{total:source.u.source_total,dims:source.u.dimensions}: {total:source.p.included_total,dims:source.p.dimensions}}
function filteredDimension(target,sourceDim,total){
  if(!linked||mode!=='users'||!selected||selected.ring===target||!sourceDim)return null;
  const from=sourceDim.column,to=current().dims[target].column;
  const values=linked.conditionals?.[from]?.[selected.name]?.[to];
  if(!Array.isArray(values)||values.length===0)return null;
  const items=values.map(v=>({name:v.name,count:Number(v.count)}));
  const valid=items.every(v=>typeof v.name==='string'&&Number.isInteger(v.count)&&v.count>=linked.min_cell_count);
  return valid&&items.reduce((sum,v)=>sum+v.count,0)===total?items:null;
}
function kpis(){
if(mode==='users'){
 const u=source.u,active=u.dimensions.find(d=>d.column==='Status').values.find(v=>v.name==='Active').count;
 const advisor=u.dimensions.find(d=>d.column==='Advisor').values.find(v=>v.name==='Advisor recorded').count;
 return [{label:'Users',value:u.source_total,ring:0,name:null},{label:'Active',value:active,ring:2,name:'Active'},{label:'Departments',value:u.dimensions[0].values.length,ring:0,name:null},{label:'Advisors',value:advisor,ring:3,name:'Advisor recorded'}];
}
const p=source.p,clusters=p.dimensions[0].values,mill=clusters.filter(v=>v.name.includes('Mill')).reduce((n,v)=>n+v.count,0);
return [{label:'Papers',value:p.included_total,ring:0,name:null},{label:'Mill linked',value:mill,ring:0,name:null},{label:'Years',value:p.dimensions[1].values.length,ring:1,name:null},{label:'Duplicates',value:p.duplicate_count,ring:0,name:null}];
}
function switchMode(m){mode=m;selected=null;kpi=null;render()}
function choose(ring,name){selected=selected&&selected.ring===ring&&selected.name===name?null:{ring,name};kpi=null;render()}
function render(){
if(!source)return;
const d=current(),cards=kpis(),total=d.total;
const focusCount=selected?d.dims[selected.ring].values.find(v=>v.name===selected.name)?.count:null;
const conditional=!!(mode==='users'&&selected&&linked&&Number.isInteger(focusCount)&&d.dims.every((_,i)=>i===selected.ring||filteredDimension(i,d.dims[selected.ring],focusCount)));
document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
cards.forEach((c,i)=>{$('label'+i).textContent=c.label;$('val'+i).textContent=fmt(c.value)});
document.querySelectorAll('[data-kpi]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.kpi)===kpi)));
let focused=selected?d.dims[selected.ring].values.find(v=>v.name===selected.name):null;
$('number').textContent=fmt(focused?focused.count:total);
$('centerLabel').textContent=focused?focused.name:mode==='users'?'Users':'Papers';
$('status').textContent=focused ? (focused.name+' · '+fmt(focused.count)+' · '+(focused.count/total*100).toFixed(1)+'% · other rings: '+(conditional?'within selection':'overall')) : '';
$('chart').setAttribute('aria-label',mode==='users'?'Mill users: four independent distributions. Select a slice to inspect its count.':'Publications: three independent distributions. Select a slice to inspect its count.');
const chart=$('chart');chart.replaceChildren();
const radii=mode==='users'?[[103,144],[155,196],[207,248],[259,301]]:[[116,164],[177,225],[238,286]];
for(let i=0;i<d.dims.length;i++){
 const dim=d.dims[i],filtered=conditional?filteredDimension(i,d.dims[selected.ring],focusCount):null;
 const values=filtered??[...dim.values],denom=filtered?focusCount:total;
 if(dim.column==='Year')values.sort((a,b)=>Number(a.name)-Number(b.name));
 else values.sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
 let angle=-Math.PI/2;
 for(let j=0;j<values.length;j++){
 const v=values[j],next=angle+(denom?v.count/denom:0)*2*Math.PI,on=selected?.ring===i&&selected?.name===v.name;
 if(v.count>0){const shape=el('path',{d:pathFor(...radii[i],angle,next),fill:palettes[i][j%palettes[i].length],class:'slice',role:'button',tabindex:0,'aria-label':dim.label+' / '+v.name+': '+fmt(v.count)});
 if(selected?.ring===i&&!on)shape.style.opacity='.3';
 if(on){shape.style.stroke='#edf7ff';shape.style.strokeWidth='3';shape.style.filter='brightness(1.16)'}
 const tip=el('title');tip.textContent=dim.label+' · '+v.name+' · '+fmt(v.count)+' of '+fmt(denom)+' ('+(denom?100*v.count/denom:0).toFixed(1)+'%)'+(filtered?' within '+selected.name:' overall');shape.append(tip);
 shape.onclick=()=>choose(i,v.name);shape.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i,v.name)}};chart.append(shape)}
 angle=next;
 }
}
}
function validate(groups,total){if(!Number.isInteger(total)||total<=0)throw Error('Invalid count');for(const d of groups)if(d.values.reduce((n,v)=>n+Number(v.count),0)!==total)throw Error('Count mismatch')}
async function load(){try{
const [ur,pr]=await Promise.all([fetch('../v2/data/user_aggregates.json',{cache:'no-store'}),fetch('../v2/data/publication_aggregates.json',{cache:'no-store'})]);
if(!ur.ok||!pr.ok)throw Error('Data unavailable');
const [u,p]=await Promise.all([ur.json(),pr.json()]);
validate(u.dimensions,u.source_total);validate(p.dimensions,p.included_total);
if(u.dimensions.length!==4||p.dimensions.length!==3)throw Error('Unexpected ring count');
source={u,p};render();
 // Optional privacy-approved marginal conditionals for one selected Mill group.
 // No conditional file is shipped yet; missing file retains accurate independent distributions.
 try{
   const res=await fetch('data/linked_user_counts.json',{cache:'no-store'});
   if(res.ok){
     const payload=await res.json();
     if(payload.source_total===u.source_total&&payload.min_cell_count>=10
       &&payload.conditionals&&typeof payload.conditionals==='object'){
       linked=payload;render();
     }
   }
 }catch(err){console.warn('Optional linked aggregates unavailable',err)}

}catch(e){$('status').textContent=e.message;console.error(e)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(source)switchMode(b.dataset.mode)});
document.querySelectorAll('[data-kpi]').forEach(b=>b.onclick=()=>{
if(!source)return;const i=Number(b.dataset.kpi),c=kpis()[i];kpi=i;
if(c.name){selected={ring:c.ring,name:c.name};}
else selected=null;
render();
});
load();
})();
</script></body></html>
