<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1423"><title>ITRSS</title>
<style>
:root{color-scheme:dark;--bg:#0b1423;--card:#17283d;--line:#344b66;--text:#ecf4ff;--muted:#adc2d9}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,path:focus-visible{outline:3px solid #b9dbff;outline-offset:2px}
main{width:min(100%,980px);height:100dvh;min-height:360px;margin:auto;padding:clamp(12px,2vw,24px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,2vh,22px)}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,1vw,12px)}
.metric{padding:clamp(9px,1.7vw,17px) 4px;background:var(--card);border:1px solid var(--line);border-radius:13px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.metric[aria-pressed=true]{background:#244867;border:2px solid #7ebdf5}
.metric span{font-size:clamp(10px,1.4vw,15px);font-weight:650}
.metric strong{font-size:clamp(19px,3vw,34px);font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1.1}
.canvas{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#112036;border:1px solid #273c56;border-radius:18px;overflow:hidden}
.donut{height:min(100%,720px);width:min(100%,720px);aspect-ratio:1;position:relative}
svg{width:100%;height:100%;display:block}
.slice{cursor:pointer;stroke:#112036;stroke-width:1;transition:opacity .12s}
.slice:hover{filter:brightness(1.15)}
.middle{position:absolute;inset:34%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:5px;text-align:center;pointer-events:none;overflow:hidden}
.middle strong{font-size:clamp(27px,5.5vw,62px);font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1.05;white-space:nowrap}
.middle span{font-size:clamp(10px,1.3vw,16px);color:#bdd0e5;max-width:100%;overflow-wrap:anywhere;line-height:1.15}
#error{position:absolute;bottom:8px;color:#f7c5ab;font-size:12px;text-align:center;max-width:80%}
@media(max-width:600px){main{gap:10px;padding:8px}.metric{border-radius:8px}.canvas{border-radius:10px}.middle{inset:34%}.middle strong{font-size:clamp(25px,8vw,43px)}.middle span{font-size:11px}}
</style></head><body><main>
<nav aria-label="Metrics">
<button type="button" class="metric" data-metric="users" aria-pressed="true"><span>Users</span><strong id="users">—</strong></button>
<button type="button" class="metric" data-metric="active" aria-pressed="false"><span>Active</span><strong id="active">—</strong></button>
<button type="button" class="metric" data-metric="papers" aria-pressed="false"><span>Papers</span><strong id="papers">—</strong></button>
<button type="button" class="metric" data-metric="duplicates" aria-pressed="false"><span>Duplicates</span><strong id="duplicates">—</strong></button>
</nav>
<section class="canvas" aria-label="Interactive metric visualization"><div class="donut">
<svg id="chart" viewBox="0 0 680 680" role="img" aria-label="Category distribution"></svg>
<div class="middle"><strong id="number">—</strong><span id="label">Users</span></div>
</div><div id="error" role="status"></div></section>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),SVG='http://www.w3.org/2000/svg';
const palette=['#609fff','#347fd1','#92c0ff','#456aaa','#82a1ca','#2ebbad','#69d6bf','#e8ad62','#d18d4d','#ae96ed','#896ccf','#c6a9f4'];
let data=null,mode='users',selected=null;
const fmt=n=>Number(n||0).toLocaleString('en-US');
const pt=(r,a)=>[340+r*Math.cos(a),340+r*Math.sin(a)];
function shape(a,b){b=Math.min(b,a+Math.PI*2-.00001);const A=pt(303,a),B=pt(303,b),C=pt(183,b),D=pt(183,a),big=b-a>Math.PI?1:0;return 'M'+A.join(' ')+' A303 303 0 '+big+' 1 '+B.join(' ')+' L'+C.join(' ')+' A183 183 0 '+big+' 0 '+D.join(' ')+' Z'}
function svg(tag,attrs){const el=document.createElementNS(SVG,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);return el}
function context(){
 const u=data.u,p=data.p;
 if(mode==='users')return {total:u.source_total,values:u.dimensions.find(d=>d.column==='Descr').values};
 if(mode==='active')return {total:u.source_total,values:u.dimensions.find(d=>d.column==='Status').values};
 if(mode==='papers')return {total:p.included_total,values:p.dimensions.find(d=>d.column==='Cluster acknowledged').values};
 return {total:p.source_total,values:[{name:'Included',count:p.included_total},{name:'Duplicates',count:p.duplicate_count}]}
}
function choose(name){selected=selected===name?null:name;render()}
function render(){
 if(!data)return;
 const ctx=context(),arr=[...ctx.values].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
 const chosen=arr.find(x=>x.name===selected);
 document.querySelectorAll('[data-metric]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.metric===mode)));
 $('number').textContent=fmt(chosen?chosen.count:ctx.total);
 $('label').textContent=chosen?chosen.name:({users:'Users',active:'Active',papers:'Papers',duplicates:'Duplicates'})[mode];
 const chart=$('chart');chart.replaceChildren();
 let a=-Math.PI/2;
 for(let i=0;i<arr.length;i++){const x=arr[i],next=a+2*Math.PI*x.count/ctx.total,on=selected===x.name;
 if(x.count){const p=svg('path',{d:shape(a,next),fill:palette[i%palette.length],class:'slice',role:'button',tabindex:'0','aria-label':x.name+': '+fmt(x.count)});
 if(selected&&!on)p.style.opacity='.2';if(on){p.style.stroke='#f3faff';p.style.strokeWidth='3'}
 const title=svg('title',{});title.textContent=x.name+' · '+fmt(x.count);p.append(title);
 p.addEventListener('click',()=>choose(x.name));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(x.name)}});chart.append(p)}
 a=next;
 }
}
function check(d,total){if(!Number.isInteger(total)||total<=0)throw Error('Invalid total');for(const x of d)if(x.values.reduce((n,v)=>n+Number(v.count),0)!==total)throw Error('Invalid categories')}
async function init(){
 try{
 const [ur,pr]=await Promise.all([fetch('../v2/data/user_aggregates.json',{cache:'no-store'}),fetch('../v2/data/publication_aggregates.json',{cache:'no-store'})]);
 if(!ur.ok||!pr.ok)throw Error('Data unavailable');
 const [u,p]=await Promise.all([ur.json(),pr.json()]);check(u.dimensions,u.source_total);check(p.dimensions,p.included_total);
 if(p.included_total+p.duplicate_count!==p.source_total)throw Error('Publication totals mismatch');
 data={u,p};
 $('users').textContent=fmt(u.source_total);
 $('active').textContent=fmt(u.dimensions.find(d=>d.column==='Status').values.find(x=>x.name==='Active')?.count||0);
 $('papers').textContent=fmt(p.included_total);$('duplicates').textContent=fmt(p.duplicate_count);
 render();
 }catch(e){$('error').textContent=e.message;console.error(e)}
}
document.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.metric;selected=null;render()}));
init();
})();
</script></body></html>
