<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1524"><title>ITRSS | Metric Center</title>
<style>
:root{color-scheme:dark;--bg:#0c1524;--surface:#142239;--border:#2d415b;--text:#eef5ff;--muted:#acc1da}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #a1d3ff;outline-offset:2px}
.page{max-width:1240px;margin:auto;padding:clamp(12px,1.8vw,24px);min-height:100dvh;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-size:18px;font-weight:800}.brand span{color:#76c6f0}
.headlink{font-size:11px;color:#b7cbe3;text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px}
h1{font-size:clamp(19px,2.2vw,27px);letter-spacing:-.03em;margin:0}.sub{color:var(--muted);font-size:12px;margin:3px 0 0}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:13px 15px;text-align:left;min-width:0;transition:border-color .12s,background .12s}
.metric[aria-pressed=true]{background:#21415e;border:2px solid #81c1fa;padding:12px 14px}
.metric:hover{border-color:#87b7e2}
.metric small{display:block;color:#b2c8df;font-size:11px;font-weight:600}
.metric strong{display:block;font-size:clamp(24px,3vw,36px);font-variant-numeric:tabular-nums;letter-spacing:-.025em;line-height:1.18;margin:5px 0}
.metric span{font-size:11px;color:#abc0d7}
.canvas{flex:1;min-height:420px;background:#111f32;border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.canvasHeader{display:flex;align-items:center;justify-content:space-between;gap:10px}
.canvasHeader h2{font-size:17px;margin:0}.canvasHeader button{font-size:11px;background:#233b56;color:white;border:1px solid #465f7a;border-radius:8px;padding:7px 12px}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(220px,.85fr);gap:16px}
.chartArea{display:flex;align-items:center;justify-content:center;min-width:0}
.donut{width:min(100%,min(68vh,570px));aspect-ratio:1;position:relative}
.donut svg{width:100%;height:100%;display:block}
.arc{cursor:pointer;stroke:#121f33;stroke-width:1;transition:opacity .12s}
.arc:hover{filter:brightness(1.18)}
.center{position:absolute;inset:34%;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;overflow:hidden}
.center small{font-weight:700;color:#a9bdd6;font-size:clamp(9px,.8vw,11px);text-transform:uppercase}
.center strong{font-size:clamp(22px,3vw,42px);letter-spacing:-.045em;line-height:1.08;font-variant-numeric:tabular-nums;white-space:nowrap}
.center span{font-size:clamp(9px,.8vw,11px);color:#afc5df;max-width:100%;overflow-wrap:anywhere}
.legendArea{border-left:1px solid var(--border);padding:5px 0 5px 15px;min-width:0;display:flex;flex-direction:column;min-height:0}
.legendTitle{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#b8cde4;font-weight:700;margin-bottom:7px}
#legend{flex:1;min-height:0;max-height:min(57vh,510px);overflow-y:auto;scrollbar-color:#7893af transparent}
.item{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:9px;border-radius:6px;color:#e9f3ff;font-size:12px;padding:6px 4px;text-align:left}
.item:hover,.item[aria-pressed=true]{background:#2b4767}
.dot{width:9px;height:9px;border-radius:3px;flex:none}.name{min-width:0;flex:1;overflow-wrap:anywhere}.count{font-size:11px;color:#b4c7df;white-space:nowrap;font-variant-numeric:tabular-nums}
footer{text-align:center;color:#8ca6bf;font-size:10px}
@media(min-width:850px) and (min-height:680px){.page{height:100dvh;min-height:680px}.canvas{min-height:0}}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.body{grid-template-columns:1fr;gap:8px}.canvas{min-height:0;padding:12px}.donut{width:min(100%,360px)}.legendArea{border-left:0;border-top:1px solid var(--border);padding:10px 0 0}#legend{max-height:190px}.page{gap:10px}}
</style></head><body><div class="page">
<header><div class="brand">S&T <span>ITRSS</span></div><a class="headlink" href="../v2/">Earlier dashboard</a></header>
<div><h1>Research computing metrics</h1><p class="sub">Tap a metric to change the chart</p></div>
<nav class="cards" aria-label="Select metric">
<button class="metric" type="button" data-metric="users" aria-pressed="true"><small>Mill users</small><strong id="usersValue">—</strong><span>Source rows</span></button>
<button class="metric" type="button" data-metric="active" aria-pressed="false"><small>Active</small><strong id="activeValue">—</strong><span>Status recorded as active</span></button>
<button class="metric" type="button" data-metric="papers" aria-pressed="false"><small>Publications</small><strong id="papersValue">—</strong><span>Included records</span></button>
<button class="metric" type="button" data-metric="duplicates" aria-pressed="false"><small>Duplicates</small><strong id="duplicatesValue">—</strong><span>Flagged publication records</span></button>
</nav>
<main class="canvas"><div class="canvasHeader"><h2 id="chartTitle">Mill users by department</h2><button id="reset" type="button">Reset selection</button></div>
<div class="body"><div class="chartArea"><div class="donut"><svg id="chart" viewBox="0 0 680 680" role="img" aria-label="Interactive metric chart"></svg><div class="center"><small id="centerLabel">Records</small><strong id="centerValue">—</strong><span id="centerText">All categories</span></div></div></div>
<div class="legendArea"><div class="legendTitle"><span id="legendTitle">Departments</span><span id="legendTotal"></span></div><div id="legend"></div></div></div>
</main><footer>Public aggregate counts. User identities withheld. Publication acknowledgments do not establish direct HPC usage.</footer>
</div><script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),SVG='http://www.w3.org/2000/svg';
const colors=['#5c9eff','#3c80d5','#8fbaff','#466ab2','#aacaf2','#39baaf','#81d5c3','#e7aa5d','#d68b49','#ad91e4','#886bd0','#c9b0ed'];
const fmt=n=>Number(n||0).toLocaleString('en-US'),pct=(n,total)=>total?(100*n/total).toFixed(1)+'%':'0%';
let source={},metric='users',selected=null;
const modes={users:{title:'Mill users by department',label:'Departments'},active:{title:'Mill users by status',label:'Status'},papers:{title:'Publications by cluster',label:'Cluster'},duplicates:{title:'Publication record quality',label:'Record status'}};
function dataFor(){
 const u=source.users,p=source.papers;
 if(metric==='users')return {total:u.source_total,values:u.dimensions.find(d=>d.column==='Descr').values};
 if(metric==='active')return {total:u.source_total,values:u.dimensions.find(d=>d.column==='Status').values};
 if(metric==='papers')return {total:p.included_total,values:p.dimensions.find(d=>d.column==='Cluster acknowledged').values};
 return {total:p.source_total,values:[{name:'Included',count:p.included_total},{name:'Duplicate-flagged',count:p.duplicate_count}]};
}
const pt=(r,a)=>[340+r*Math.cos(a),340+r*Math.sin(a)];
const svg=(tag,attrs={})=>{const e=document.createElementNS(SVG,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e};
function arc(ri,ro,a,b){b=Math.min(b,a+Math.PI*2-.00001);const A=pt(ro,a),B=pt(ro,b),C=pt(ri,b),D=pt(ri,a),lg=b-a>Math.PI?1:0;return 'M'+A.join(' ')+' A'+ro+' '+ro+' 0 '+lg+' 1 '+B.join(' ')+' L'+C.join(' ')+' A'+ri+' '+ri+' 0 '+lg+' 0 '+D.join(' ')+' Z'}
function choose(name){selected=selected===name?null:name;render()}
function render(){
 const d=dataFor(),total=d.total;
 const items=[...d.values].sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
 document.querySelectorAll('[data-metric]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.metric===metric)));
 $('chartTitle').textContent=modes[metric].title;$('legendTitle').textContent=modes[metric].label;$('legendTotal').textContent=fmt(total);
 const focused=items.find(x=>x.name===selected);
 $('centerLabel').textContent=focused?'Selected':'Records';$('centerValue').textContent=fmt(focused?focused.count:total);$('centerText').textContent=focused?focused.name:'All categories';
 const chart=$('chart'),legend=$('legend');chart.replaceChildren();legend.replaceChildren();let angle=-Math.PI/2;
 for(let i=0;i<items.length;i++){const x=items[i],next=angle+x.count/total*Math.PI*2,color=colors[i%colors.length],isSelected=x.name===selected;
 if(x.count>0){const path=svg('path',{d:arc(184,304,angle,next),fill:color,class:'arc',tabindex:0,role:'button','aria-label':x.name+': '+fmt(x.count)});if(selected&&!isSelected)path.style.opacity='.23';if(isSelected){path.style.stroke='#f8fbff';path.style.strokeWidth=3}path.addEventListener('click',()=>choose(x.name));path.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(x.name)}});const title=svg('title');title.textContent=x.name+' · '+fmt(x.count)+' ('+pct(x.count,total)+')';path.append(title);chart.append(path)}angle=next;
 const button=document.createElement('button');button.className='item';button.type='button';button.setAttribute('aria-pressed',String(isSelected));const dot=document.createElement('i');dot.className='dot';dot.style.background=color;const name=document.createElement('span');name.className='name';name.textContent=x.name;const count=document.createElement('span');count.className='count';count.textContent=fmt(x.count)+' · '+pct(x.count,total);button.append(dot,name,count);button.onclick=()=>choose(x.name);legend.append(button)}
}
function validate(d,total){if(!Number.isInteger(total)||total<1)throw Error('Invalid total');for(const x of d){if(x.values.reduce((s,v)=>s+Number(v.count),0)!==total)throw Error('Counts mismatch for '+x.label)}}
async function start(){try{
 const [ur,pr]=await Promise.all([fetch('../v2/data/user_aggregates.json',{cache:'no-store'}),fetch('../v2/data/publication_aggregates.json',{cache:'no-store'})]);
 if(!ur.ok||!pr.ok)throw Error('Published counts unavailable');
 const users=await ur.json(),papers=await pr.json();validate(users.dimensions,users.source_total);validate(papers.dimensions,papers.included_total);
 if(papers.included_total+papers.duplicate_count!==papers.source_total)throw Error('Publication totals mismatch');
 source={users,papers};
 const active=users.dimensions.find(d=>d.column==='Status').values.find(x=>x.name==='Active')?.count||0;
 $('usersValue').textContent=fmt(users.source_total);$('activeValue').textContent=fmt(active);$('papersValue').textContent=fmt(papers.included_total);$('duplicatesValue').textContent=fmt(papers.duplicate_count);
 render();
 }catch(e){$('chartTitle').textContent='Unable to load metrics';$('centerText').textContent=e.message;console.error(e)}}
document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{if(!source.users)return;metric=b.dataset.metric;selected=null;render()});
$('reset').onclick=()=>{selected=null;if(source.users)render()};
start();
})();
</script></body></html>
