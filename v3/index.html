<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1423">
<title>ITRSS · V3 Metric Center</title>
<style>
:root{color-scheme:dark;--bg:#0b1423;--card:#121f32;--card2:#17273d;--border:#2b405a;--text:#ecf4ff;--muted:#9db2ca;--blue:#75b9ff}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select{font:inherit}button{cursor:pointer}
#app{height:100dvh;min-height:510px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:clamp(10px,1.4vw,20px);max-width:1800px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.035em;font-size:17px}.brand b{color:#67c2ec}.version{font-size:11px;color:#adc4df;border:1px solid #405b79;border-radius:6px;padding:3px 6px;margin-left:8px}
.headerRight{display:flex;gap:7px;align-items:center}.headerRight a,.smallBtn{color:#d8eaff;text-decoration:none;background:#1d3049;border:1px solid #38536f;border-radius:8px;padding:7px 10px;font-size:12px}
nav{display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-height:36px}
.preset{background:#17283e;border:1px solid #334a67;color:#c9dcf2;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600}
.preset[aria-pressed=true]{background:#2b618e;color:white;border-color:#74b8fa}
.content{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.8fr);gap:12px;min-height:0}
.chartPanel,.side{background:linear-gradient(150deg,#152439,#101c2e);border:1px solid var(--border);border-radius:16px;min-height:0}
.chartPanel{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:14px;min-width:0}
.panelHead{display:flex;justify-content:space-between;gap:10px;align-items:center}
h1{font-size:clamp(15px,1.6vw,20px);letter-spacing:-.015em;margin:0}.subline{color:var(--muted);font-size:11px}
.miniStat{white-space:nowrap;text-align:right}.miniStat strong{font-size:clamp(17px,2vw,26px);display:block;line-height:1.1;font-variant-numeric:tabular-nums}.miniStat span{font-size:10px;color:var(--muted)}
.chartArea{display:flex;align-items:center;justify-content:center;position:relative;min-height:0;min-width:0;padding:4px}
.chartInner{position:relative;aspect-ratio:1;height:100%;max-width:100%;max-height:100%;width:auto}
#chart{height:100%;width:100%;display:block}
.ring{stroke:#122036;stroke-width:1;cursor:pointer;transition:opacity .15s}
.ring:focus{outline:none;stroke:#f3faff;stroke-width:3}.ring:hover{filter:brightness(1.15)}
.center{position:absolute;inset:34%;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.center small{font-size:clamp(8px,.7vw,11px);letter-spacing:.08em;text-transform:uppercase;color:#aabed5;font-weight:700}
.center strong{font-size:clamp(22px,4vw,62px);font-variant-numeric:tabular-nums;line-height:1.2}
.center span{font-size:clamp(9px,.9vw,12px);color:#b7cbe0;max-width:100%;overflow-wrap:anywhere}
.chartBottom{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:var(--muted);min-height:25px}
.chartBottom p{margin:0}.chartBottom button{flex-shrink:0}
.side{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);padding:14px;overflow:hidden;gap:10px}
.sideHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.sideHead strong{font-size:14px}
fieldset{border:0;margin:0;padding:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label{font-size:11px;color:#b7cbe3;display:flex;flex-direction:column;gap:4px}
select{width:100%;min-width:0;padding:9px 8px;background:#20334d;color:#f4f8ff;border:1px solid #435a76;border-radius:8px;white-space:nowrap;text-overflow:ellipsis}
select:disabled{opacity:.48}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tool{background:#20344e;color:#e4f2ff;border:1px solid #3c5876;border-radius:8px;padding:7px 10px;font-size:11px}
.tool[aria-pressed=true]{background:#315c7d;border-color:#76b9f7}
#focus{font-size:11px;min-height:20px;color:#b9cfeb;overflow-wrap:anywhere}
.legend{min-height:0;overflow-y:auto;scrollbar-color:#68819d transparent;scrollbar-width:thin;padding-right:5px}
.legendHead{display:flex;align-items:center;justify-content:space-between;color:#a4bdd7;font-size:11px;font-weight:700;border-bottom:1px solid #2b3f58;padding:10px 0 6px;margin-bottom:3px}
.legendHead:first-child{padding-top:0}
.entry{display:flex;align-items:center;width:100%;text-align:left;gap:7px;padding:5px 3px;border-radius:6px;background:transparent;border:0;color:#dceafb;font-size:11px}
.entry:hover,.entry[aria-pressed=true]{background:#2b4462}
.swatch{width:9px;height:9px;flex:none;border-radius:2px}
.entry .name{flex:1;min-width:0;overflow-wrap:anywhere}.entry .count{font-variant-numeric:tabular-nums;color:#b3c6de;white-space:nowrap}
#notice{color:#f5c9ac;font-size:12px}
@media(max-width:800px){#app{min-height:0;height:100dvh;gap:7px;padding:8px}.content{grid-template-columns:minmax(0,1.3fr) minmax(215px,.8fr);gap:7px}.chartPanel,.side{padding:9px}.preset{padding:7px 9px}.fields{grid-template-columns:1fr 1fr}}
@media(max-width:610px){#app{grid-template-rows:auto auto minmax(0,1fr)}header{min-height:28px}.brand{font-size:14px}.headerRight a{padding:5px}.content{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(180px,.56fr)}nav{gap:4px}.preset{padding:6px 9px;font-size:11px}.chartPanel{padding:8px}.side{padding:9px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:6px}.sideHead{grid-column:1/-1}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.tools{align-content:start}.legend{grid-column:2;grid-row:2/4}.side #focus{grid-column:1}.chartBottom{font-size:10px}.entry{font-size:10px;padding:4px 3px}}
@media(max-height:700px) and (min-width:611px){#app{gap:6px;padding:8px}.chartPanel,.side{padding:9px}.preset{padding:6px 9px}.fields{gap:5px}.chartBottom{min-height:18px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">S&T <b>ITRSS</b><span class="version">V3 · Metric Center</span></div><div class="headerRight"><a href="../">V1</a><a href="../v2/">V2</a><button class="smallBtn" id="fullscreen" type="button">Full screen</button></div></header>
<nav aria-label="Metric presets">
<button class="preset" data-preset="dept" aria-pressed="true">Departments</button>
<button class="preset" data-preset="class" aria-pressed="false">Classifications</button>
<button class="preset" data-preset="status" aria-pressed="false">Status</button>
<button class="preset" data-preset="advisor" aria-pressed="false">Advisors</button>
<button class="preset" data-preset="papers" aria-pressed="false">Publications</button>
<button class="preset" data-preset="years" aria-pressed="false">Years</button>
</nav>
<div class="content">
<section class="chartPanel">
<div class="panelHead"><div><h1 id="heading">Mill users</h1><div class="subline" id="subtitle">Real aggregate counts · largest → smallest clockwise</div></div><div class="miniStat"><strong id="total">—</strong><span id="totalLabel">Source records</span></div></div>
<div class="chartArea"><div class="chartInner"><svg id="chart" viewBox="0 0 680 680" role="img" aria-label="Interactive concentric metric chart"></svg><div class="center"><small id="centerLabel">Records</small><strong id="centerCount">—</strong><span id="centerText">All categories</span></div></div></div>
<div class="chartBottom"><p id="note">Click a slice to pin it. Other rings stay fixed.</p><button class="tool" type="button" id="clear">Clear focus</button></div>
</section>
<aside class="side">
<div class="sideHead"><strong>Controls</strong><button class="tool" id="order" type="button">Sort: largest ↓</button></div>
<fieldset class="fields" id="fields" aria-label="Ring selectors"></fieldset>
<div class="tools"><button class="tool" type="button" id="reset">Reset</button><button class="tool" type="button" id="rings">Rings: 4</button><span id="focus"></span></div>
<div class="legend" id="legend" aria-label="Metric category legend"></div>
</aside></div>
</div>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const palettes=[['#5c9eff','#3c7fdb','#8ebdff','#4568ae','#a1ceef','#6669ba','#378dc0'],['#2cbdaf','#159f94','#75d8bd','#3a8f85','#a1e0c9','#5eb3a2'],['#e6a85e','#d58e46','#f3c681','#b87555','#ffd59e'],['#ad91e4','#906dd1','#c4a9fa','#7157a9','#b39fe2']];
const presets={
dept:{family:'users',index:0,label:'Departments'},class:{family:'users',index:1,label:'Classifications'},status:{family:'users',index:2,label:'Status'},advisor:{family:'users',index:3,label:'Advisors'},
papers:{family:'papers',index:0,label:'Publications'},years:{family:'papers',index:1,label:'Years'}};
let data={},preset='dept',fields=[],ringCount=4,pinned=null,order='desc';
const nfmt=x=>Number(x||0).toLocaleString('en-US');
const pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'0%';
const SVG='http://www.w3.org/2000/svg';
const svg=(name,attrs={})=>{const e=document.createElementNS(SVG,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e};
const polar=(r,t)=>[340+r*Math.cos(t),340+r*Math.sin(t)];
function arc(ri,ro,a,b){b=Math.min(b,a+Math.PI*2-.00001);const [x1,y1]=polar(ro,a),[x2,y2]=polar(ro,b),[x3,y3]=polar(ri,b),[x4,y4]=polar(ri,a);return 'M'+x1+' '+y1+' A'+ro+' '+ro+' 0 '+(b-a>Math.PI?1:0)+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+ri+' '+ri+' 0 '+(b-a>Math.PI?1:0)+' 0 '+x4+' '+y4+' Z'}
function current(){return data[presets[preset].family]}
function dim(i){return current().dimensions[fields[i]]}
function sorted(d){const a=[...d.values];if(order==='alpha')a.sort((x,y)=>x.name.localeCompare(y.name));else if(order==='year'&&d.column==='Year')a.sort((x,y)=>Number(x.name)-Number(y.name));else a.sort((x,y)=>y.count-x.count||x.name.localeCompare(y.name));return a}
function validate(d,total){if(!Number.isInteger(total)||total<=0)throw Error('Invalid total');for(const x of d){if(x.values.reduce((a,y)=>a+Number(y.count),0)!==total)throw Error('Counts mismatch: '+x.label)}}
function selectPreset(k){preset=k;pinned=null;const p=presets[k],ds=current().dimensions;fields=[p.index,...ds.map((_,i)=>i).filter(i=>i!==p.index)];ringCount=ds.length;order='desc';build();render()}
function build(){const root=$('fields');root.replaceChildren();for(let i=0;i<4;i++){const label=document.createElement('label');label.textContent='Ring '+(i+1);const select=document.createElement('select');select.disabled=i>=ringCount||i>=current().dimensions.length;for(let j=0;j<current().dimensions.length;j++){const x=document.createElement('option');x.value=j;x.textContent=current().dimensions[j].label;select.append(x)}select.value=fields[i]??0;select.onchange=()=>{fields[i]=Number(select.value);pinned=null;render()};label.append(select);root.append(label)}$('rings').textContent='Rings: '+ringCount;$('order').textContent=order==='alpha'?'Sort: A–Z':order==='year'?'Sort: year ↑':'Sort: largest ↓'}
function pin(i,name){if(pinned&&pinned.i===i&&pinned.name===name)pinned=null;else pinned={i,name};render()}
function render(){
 const d=current(),total=d.total;document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===preset)));
 $('heading').textContent=presets[preset].label;$('total').textContent=nfmt(total);$('totalLabel').textContent=presets[preset].family==='users'?'Mill source rows':'Included publications';
 const primary=pinned?dim(pinned.i).values.find(v=>v.name===pinned.name):null;
 $('centerCount').textContent=nfmt(primary?primary.count:total);
 $('centerLabel').textContent=primary?'Pinned category':'Records';
 $('centerText').textContent=primary?primary.name:'All categories';
 $('focus').textContent=primary?pct(primary.count,total)+' of total':'';
 $('note').textContent=primary?'Pinned · other rings stay unchanged':'Click a slice to pin. Rings remain fixed.';
 $('subtitle').textContent=presets[preset].family==='users'?'1,607 source rows · aggregated':'230 included · 17 duplicates excluded';
 const chart=$('chart'),legend=$('legend');chart.replaceChildren();legend.replaceChildren();
 const radii=[[93,139],[147,193],[201,247],[255,301]];
 for(let i=0;i<ringCount;i++){
 const dimension=dim(i),items=sorted(dimension);if(!dimension)continue;
 let angle=-Math.PI/2;const head=document.createElement('div');head.className='legendHead';const h=document.createElement('span');h.textContent='Ring '+(i+1)+' · '+dimension.label;const cnt=document.createElement('span');cnt.textContent=nfmt(total);head.append(h,cnt);legend.append(head);
 for(let j=0;j<items.length;j++){
 const item=items[j],sweep=total?item.count/total*Math.PI*2:0,end=angle+sweep,color=palettes[i][j%palettes[i].length],chosen=pinned?.i===i&&pinned.name===item.name;
 if(sweep>0){const path=svg('path',{d:arc(...radii[i],angle,end),fill:color,class:'ring',tabindex:0,role:'button','aria-label':dimension.label+' '+item.name+' '+nfmt(item.count)});if(pinned?.i===i&&!chosen)path.style.opacity='.24';if(chosen){path.style.stroke='#edf8ff';path.style.strokeWidth='2.4'}const title=svg('title');title.textContent=dimension.label+' / '+item.name+': '+nfmt(item.count)+' ('+pct(item.count,total)+')';path.append(title);path.onclick=()=>pin(i,item.name);path.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pin(i,item.name)}};chart.append(path)}angle=end;
 const row=document.createElement('button');row.className='entry';row.type='button';row.setAttribute('aria-pressed',String(!!chosen));const sw=document.createElement('i');sw.className='swatch';sw.style.background=color;const name=document.createElement('span');name.className='name';name.textContent=item.name;const count=document.createElement('span');count.className='count';count.textContent=nfmt(item.count)+' · '+pct(item.count,total);row.append(sw,name,count);row.onclick=()=>pin(i,item.name);legend.append(row);
 }
 }
}
async function start(){
 try{
 const [u,p]=await Promise.all([fetch('../v2/data/user_aggregates.json',{cache:'no-store'}),fetch('../v2/data/publication_aggregates.json',{cache:'no-store'})]);
 if(!u.ok||!p.ok)throw Error('Aggregate files unavailable');
 const users=await u.json(),papers=await p.json();
 validate(users.dimensions,users.source_total);validate(papers.dimensions,papers.included_total);
 data={users:{total:users.source_total,dimensions:users.dimensions},papers:{total:papers.included_total,dimensions:papers.dimensions}};
 selectPreset('dept');
 }catch(e){$('heading').textContent='Data unavailable';$('note').textContent=e.message;console.error(e)}
}
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{if(data.users)selectPreset(b.dataset.preset)});
$('clear').onclick=()=>{pinned=null;render()};
$('reset').onclick=()=>selectPreset(preset);
$('rings').onclick=()=>{ringCount=ringCount>=current().dimensions.length?1:ringCount+1;pinned=null;build();render()};
$('order').onclick=()=>{order=order==='desc'?'alpha':order==='alpha'?'year':'desc';build();render()};
$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};
start();
})();
</script>
</body>
</html>
